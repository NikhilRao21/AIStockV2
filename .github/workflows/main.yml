name: Deploy to server
on:
  push:
    branches: [main]
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: deploy  # never run two deploys against the server at once
    steps:
      - name: Update code and restart bot over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 20m  # graceful stop can wait up to 5 min for a sweep step
          # Update in place so gitignored state (.env, trading_system.db, summaryReflection.txt, logs/, .venv)
          # survives. summaryReflection.txt used to be tracked, so back it up across the commit that untracks it.
          # bot.sh deploy installs deps and runs a preflight check (env + Alpaca) BEFORE stopping the old bot,
          # so a broken config fails this job and leaves the running bot alone.
          script: |
            set -e
            cd ~/AIStockV2
            cp summaryReflection.txt ~/Documents/summaryReflection.txt.bak 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            [ -f summaryReflection.txt ] || cp ~/Documents/summaryReflection.txt.bak summaryReflection.txt 2>/dev/null || true
            bash deploy/bot.sh deploy
            bash deploy/bot.sh status
