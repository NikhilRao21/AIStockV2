name: Deploy to server
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Update code on server over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # Update in place so gitignored state (.env, trading_system.db, summaryReflection.txt, logs/)
          # survives, and the running process's working directory isn't deleted out from under it.
          # summaryReflection.txt used to be tracked, so back it up across the commit that untracks it.
          script: |
            set -e
            cd ~/AIStockV2
            cp summaryReflection.txt ~/Documents/summaryReflection.txt.bak 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            [ -f summaryReflection.txt ] || cp ~/Documents/summaryReflection.txt.bak summaryReflection.txt 2>/dev/null || true
            echo "Updated to $(git rev-parse --short HEAD). Restart the trading process to pick up changes."
